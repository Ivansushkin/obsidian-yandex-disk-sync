name: Verify published release assets

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          YANDEX_OAUTH_CLIENT_SECRET: ${{ secrets.YANDEX_OAUTH_CLIENT_SECRET_2_2_0 }}
      - run: npm run check:bundle
      - run: npm audit --omit=dev --registry=https://registry.npmjs.org
      - run: npm audit --registry=https://registry.npmjs.org
      - run: npm run validate:release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - name: Verify published assets and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir published-assets
          gh release download "$RELEASE_TAG" --dir published-assets
          node scripts/verify-published-assets.mjs published-assets build
          release_commit="$(git rev-parse HEAD)"
          for asset in main.js styles.css; do
            gh attestation verify "published-assets/$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/$RELEASE_TAG" \
              --source-digest "$release_commit"
          done
